<style>
:root{
  --bg:#050B15; --panel:#0c1a33; --card:#112447; --line:#2B8CEB; --cyan:#3CC4E6;
  --fg:#eaf1fa; --muted:#9db1cf; --dark:#0a1630;
  --ok:#4cc27a; --warn:#f2c94c; --bad:#ff5a4e; --onca:#f2b632; --onca-out:#13234d; --cream:#fff4dc; --gorro:#2a56d6;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ft:"Syne","Inter",sans-serif; --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --borda:color-mix(in srgb,var(--line) 40%,transparent); --fina:color-mix(in srgb,var(--line) 18%,transparent);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}

/* estrutura: menu lateral (computador) e menu no topo (celular) */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh;--destaque-fundo:#13233F;--destaque-borda:rgba(43,140,235,.55)}
.lado{position:sticky;top:0;height:100dvh;overflow-y:auto;border-right:1px solid var(--fina);background:#060E1C;padding:18px 12px;display:flex;flex-direction:column;gap:14px}
.lado .rot{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.75;padding:0 4px}
.lado select{background:var(--panel);border:1px solid var(--borda);border-radius:10px;padding:8px 10px;width:100%;font-size:13.5px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu .grupo{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7;padding:12px 12px 4px}
.menu button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;font-size:14px;font-weight:600;color:var(--muted);padding:9px 12px;border-radius:9px;white-space:nowrap;cursor:pointer;transition:background .16s,color .16s}
.menu button svg{width:17px;height:17px;flex:0 0 auto}
.menu button:hover{background:var(--panel);color:var(--fg)}
.menu button[aria-current="page"]{background:color-mix(in srgb,var(--onca) 14%,transparent);color:var(--onca)}
.menu button b{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--onca);color:#1a1200;border-radius:999px;padding:1px 7px}
.menu button b:empty{display:none}
.lado-pe{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--fina)}
.sair{background:none;border:1px solid var(--borda);border-radius:10px;padding:8px 12px;color:var(--muted);cursor:pointer;text-align:left}
.sair:hover{color:var(--fg)}
.conteudo{min-width:0;width:100%;max-width:1280px;padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px}
.cab{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--fina)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca svg{width:40px;height:40px;flex:0 0 auto}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{margin:0;font-family:var(--ft);font-size:clamp(20px,2.2vw,26px);font-weight:800;line-height:1.1;letter-spacing:-.01em}
h2{margin:0 0 4px;font-family:var(--ft);font-size:18px;font-weight:700}
h3{margin:0;font-size:15.5px;font-weight:700}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .lado{position:static;height:auto;border-right:0;border-bottom:1px solid var(--fina);padding:max(12px,env(safe-area-inset-top,0px)) 16px 10px;gap:10px}
  .lado .topo-m{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lado .rot{display:none}
  .menu{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;position:sticky;top:0}
  .menu::-webkit-scrollbar{display:none}
  .menu .grupo{display:none}
  .menu button{padding:8px 12px;border-radius:999px}
  .lado-pe{display:none}
  .conteudo{padding:16px 16px 48px}
}
@media (min-width:901px){ .sair-m{display:none} }

/* blocos */
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--fina);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.destaque{border-color:var(--borda)}
.num{font-size:30px;font-weight:900;font-stretch:115%;line-height:1}
.muted{color:var(--muted)}
.peq{font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entre{justify-content:space-between}
.passos{list-style:none;padding:0;margin:4px 0;display:flex;flex-direction:column;gap:8px}.passos li{display:flex;gap:8px;align-items:flex-start}.grade .card.largo{grid-column:1/-1}
.pill{font-family:var(--mono);font-size:11.5px;border-radius:999px;padding:3px 9px;border:1.5px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .info{color:var(--cyan)} .onca{color:var(--onca)}
.aviso{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel));padding:12px 14px;border-radius:10px}
.aviso.info{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 7%,var(--panel));color:var(--fg)}

/* interruptores */
.chave{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--fina)}
.chave:first-of-type{border-top:0}
.chave .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sw{position:relative;width:50px;height:28px;flex:0 0 auto}
.sw input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;inset:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:#2a3b5c;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:disabled{cursor:not-allowed}.sw input:disabled+span{opacity:.45}
.sw input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:2px}

/* botões e campos */
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--card);color:var(--fg);border:1px solid var(--borda)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sim{background:var(--ok);color:#04220f;border-color:transparent}
.btn.onca{background:var(--onca);color:#1a1200;border-color:transparent}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.kpi{padding:10px 12px;gap:2px}.kpi-n{font-size:26px;font-weight:800;line-height:1.1}
.btn.nao{background:none;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.btn.prim{background:var(--onca);color:#1b1300;border-color:transparent}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=datetime-local],select,textarea{
  background:var(--dark);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;width:100%;min-width:0;color:var(--fg);font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.menu button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* conteúdos */
.dia{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin:6px 0 -4px}
.peca{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
@media (max-width:560px){.peca{grid-template-columns:1fr}}
.midia{display:flex;gap:6px;overflow-x:auto;border-radius:12px}
.midia img,.midia video{width:120px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--dark);flex:0 0 auto}
@media (max-width:560px){.midia img,.midia video{width:46%}}
.legenda{white-space:pre-wrap;font-size:13.5px;color:var(--muted);max-height:4.4em;overflow:hidden}
.legenda.aberta{max-height:none;color:var(--fg)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

/* leads e atividade */
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtros input{flex:1 1 220px}.filtros select{flex:0 1 200px}
.lead{display:flex;flex-direction:column;gap:6px}
.lead .msg{background:var(--dark);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap}
.tempo{display:flex;flex-direction:column}
.tempo .it{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--fina);font-size:13.5px}
.tempo .it:first-child{border-top:0}

/* níveis */
.niveis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.nivel{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--fina);border-radius:12px;cursor:pointer}
.nivel:has(input:checked){border-color:var(--onca);background:color-mix(in srgb,var(--onca) 8%,transparent)}
.nivel input{margin-top:3px;accent-color:var(--onca)}

/* login */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:start;gap:28px;padding:24px max(16px,3vw) 40px;max-width:1440px;margin:0 auto;box-sizing:border-box}.login .exp{width:100%}.login>.card{width:100%!important;position:sticky;top:20px}@media (max-width:900px){.login{grid-template-columns:1fr;gap:22px}.login>.card{order:-1;max-width:420px;justify-self:center;position:static}}
.login h1{text-align:center}
.login .card{width:min(100%,400px);gap:14px;padding:24px}
.login .marca svg{width:56px;height:56px}

.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px 16px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.erro{border-color:var(--bad)}
.vazio{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--fina);border-radius:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<template id="mascote">

  <ellipse cx="160" cy="204" rx="48" ry="42" fill="var(--onca)" stroke="var(--onca-out)" stroke-width="4"/>
  <ellipse cx="160" cy="226" rx="26" ry="18" fill="var(--cream)" stroke="var(--onca-out)" stroke-width="3.5"/>
  <path d="M151 214 h18 l-9 9z" fill="var(--onca-out)"/><path d="M148 229 q12 10 24 0" fill="none" stroke="var(--onca-out)" stroke-width="3" stroke-linecap="round"/>
  <rect x="124" y="188" width="33" height="21" rx="8" fill="var(--onca-out)"/><rect x="163" y="188" width="33" height="21" rx="8" fill="var(--onca-out)"/>
  <path d="M112 186 C110 136 210 136 208 186 Z" fill="var(--gorro)" stroke="var(--onca-out)" stroke-width="4"/>

<!-- LOGIN -->

<!-- APP -->

  </main>
</div>

<script src="assets/base.js?v=20261118a"></script>
<script src="assets/equipe.js?v=20261117c"></script>

<script>
"use strict";
// Supabase (sb), $, $$, esc, urlSegura, hrefSeguro e FUSO vêm de assets/base.js (comum ao System e ao Prospect).
const st = { ctx: null, agente: null, resumo: null, conteudos: [], leads: [], aba: "inicio" };

document.querySelectorAll("[data-mascote]").forEach(el => el.replaceWith($("#mascote").content.cloneNode(true)));

// ---------------------------------------------------------------- utilidades
function quando(iso, comHora = true) {
  if (!iso) return "sem data";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", { timeZone: FUSO, weekday: "short", day: "2-digit", month: "2-digit", ...(comHora ? { hour: "2-digit", minute: "2-digit" } : {}) });
}
function diaChave(iso) { return iso ? new Date(iso).toLocaleDateString("pt-BR", { timeZone: FUSO, weekday: "long", day: "2-digit", month: "long" }) : "Sem data"; }
function paraInput(iso) {
  if (!iso) return "";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: FUSO, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function deInput(v) { return v ? new Date(`${v}:00-03:00`).toISOString() : null; } // horário de Brasília (sem horário de verão)
const ERROS = {
  sem_permissao: "Seu papel nesta empresa não permite essa ação.",
  sem_login: "Sua sessão acabou. Entre de novo.",
  horario_passou: "O horário já passou. Escolha uma data futura antes de aprovar.",
  peca_sem_midia: "Essa peça ainda não tem arte ou vídeo. Não dá para aprovar.",
  so_aprova_peca_em_revisao: "Só dá para aprovar peças que estão esperando revisão.",
  ja_publicado: "Essa peça já foi publicada.",
  nivel_insuficiente: "Essa função pede um nível de autonomia maior. Mude o nível na aba Agente primeiro.",
  sensivel_exige_aprovacao: "Publicar, mandar mensagem e anúncio só saem sem aprovação no nível 4 (Autônomo).",
  nao_reagenda_neste_status: "Essa peça não pode mais mudar de data.",
  nome_vazio: "O nome não pode ficar vazio.", texto_vazio: "Escreva as instruções antes de salvar.",
  nao_posta_neste_status: "Essa peça já foi publicada, está publicando ou foi recusada.",
  versao_nao_encontrada: "Essa versão não existe mais.",
  conteudo_invalido: "O conteúdo não está no formato esperado. Confira e tente de novo.",
  tipo_nao_suportado: "O banco ainda não aceita essa conexão. Falta aplicar a migração do Google.",
  campanha_invalida: "Confira os campos da campanha.", campanha_nao_encontrada: "Essa campanha não existe mais.",
  campanha_pausada: "Ative a campanha antes de pedir a pesquisa.", registro_invalido: "Confira o registro.", empresa_nao_encontrada: "Essa empresa não existe mais.", status_invalido: "Status inválido."
};
function msgErro(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  for (const k in ERROS) if (m.includes(k)) return ERROS[k];
  if (/Invalid login/i.test(m)) return "E-mail ou senha errados.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem internet ou servidor fora do ar. Tente de novo.";
  return "Não deu certo: " + m;
}
let toastT;
function aviso(txt, erro = false) {
  const t = $("#toast"); t.textContent = txt; t.className = "toast" + (erro ? " erro" : ""); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.add("oculto"), erro ? 6000 : 3200);
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { if (/sem_login|JWT/i.test(error.message)) { await sb.auth.signOut(); mostrarLogin(); } throw error; }
  return data;
}

async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return mostrarLogin();
  try { st.ctx = await rpc("nexo_contexto"); } catch (e) { aviso(msgErro(e), true); return mostrarLogin(); }
  const todosAgentes = st.ctx.empresas.flatMap(e => e.agentes.map(a => ({ ...a, empresa: e.nome, papel: e.papel })));
  st.prospect = todosAgentes.find(a => a.slug === "prospect") || null;
  const agentes = todosAgentes.filter(a => a.slug !== "prospect");
  if (!agentes.length) {
    $("#telaLogin").classList.add("oculto"); $("#telaApp").classList.remove("oculto"); expVideo?.parar();
    $("[data-sec=inicio]").innerHTML = `<div class="vazio">Seu login (${esc(st.ctx.email)}) ainda não tem acesso a nenhuma empresa. Peça ao administrador para incluir você.</div>`;
    return;
  }
  let salvo = null; try { salvo = localStorage.getItem("nexo.agente"); } catch {}
  $("#selAgente").innerHTML = agentes.map(a => `<option value="${a.id}">${esc(a.empresa)} · ${esc(a.nome)}</option>`).join("");
  st.agente = agentes.find(a => a.id === salvo)?.id || agentes[0].id;
  $("#selAgente").value = st.agente;
  $("#selAgente").onchange = () => { st.agente = $("#selAgente").value; try { localStorage.setItem("nexo.agente", st.agente); } catch {} carregar(); };
  $("#telaLogin").classList.add("oculto"); $("#telaApp").classList.remove("oculto"); expVideo?.parar();
  let aba = "equipe"; try { aba = localStorage.getItem("nexo.aba") || "equipe"; } catch {}
  if (!document.querySelector(`.menu [data-aba="${aba}"]`)) aba = "equipe"; // aba que não existe mais (ex.: a antiga "prospect") volta para a Equipe
  // Volta do "Entrar com Facebook": mostra o resultado e limpa o endereço.
  const volta = new URLSearchParams(location.search);
  if (volta.get("conexao")) {
    aba = "integracoes";
    const nomeServ = volta.get("servico") === "google" ? "Google conectado pelo login oficial do Google" : "Instagram conectado pelo login oficial da Meta";
    setTimeout(() => aviso(volta.get("conexao") === "ok" ? nomeServ + ". A chave foi para o cofre."
                                                         : "A conexão não terminou: " + (volta.get("motivo") || "tente de novo."), volta.get("conexao") !== "ok"), 400);
    history.replaceState(null, "", location.pathname);
  }
  await carregar();
  abrirAba($(`.menu button[data-aba="${aba}"]`) ? aba : "equipe");
}
async function carregar() {
  try {
    const [r, c, l] = await Promise.all([rpc("nexo_resumo", { p_agente: st.agente }), rpc("nexo_conteudos", { p_agente: st.agente }), rpc("nexo_leads", { p_agente: st.agente })]);
    st.resumo = r; st.conteudos = c || []; st.leads = l || [];
    const ident = r.identidade || {};
    $("#nomeEmpresa").textContent = r.empresa?.nome || "NEXO System";
    $("#nomeAgente").textContent = ident.nome_exibicao || r.agente?.nome || "Agente";
    aplicarLogo();
    const n = st.conteudos.filter(x => x.status === "revisar").length;
    $("#nAprovar").textContent = n ? n : "";
    desenhar();
  } catch (e) { aviso(msgErro(e), true); }
}
function desenhar() {
  if (!st.resumo) return;
  ({ equipe, ideias, inicio, aprovar, agente, funcoes, conhecimento, integracoes, atividade, ajuda })[st.aba]?.($(`[data-sec="${st.aba}"]`));
}

// ---------------------------------------------------------------- APROVAR
const ST_PECA = { revisar: ["esperando você", "warn"], pronto: ["aprovada", "ok"], publicando: ["publicando", "info"], publicado: ["publicada", "info"], erro: ["erro", "bad"], rascunho: ["rascunho", "muted"] };
function midiaHtml(m) {
  return (m || []).slice(0, 10).map(x => x.tipo === "video"
    ? `<video src="${esc(x.url)}" preload="metadata" controls playsinline muted></video>`
    : `<a href="${hrefSeguro(x.url)}" target="_blank" rel="noopener" aria-label="Abrir a arte em tamanho real"><img src="${esc(x.mini || x.url)}" alt="" loading="lazy"></a>`).join("");
}
function aprovar(el) {
  const lista = st.conteudos;
  const pub = st.resumo.controle?.publicar;
  if (!lista.length) { el.innerHTML = `<div class="vazio">Nenhuma peça na fila.</div>`; return; }
  let html = pub ? "" : `<div class="aviso info">Publicar está <b>desligado</b>. Aprovar deixa a peça pronta; ela só vai ao ar quando você ligar Publicar no Início.</div>`;
  let diaAtual = "";
  for (const c of lista) {
    const d = diaChave(c.agendado_para);
    if (d !== diaAtual) { html += `<div class="dia">${esc(d)}</div>`; diaAtual = d; }
    const [rot, cls] = ST_PECA[c.status] || [c.status, "muted"];
    const editavel = ["revisar", "erro", "rascunho", "pronto"].includes(c.status);
    html += `
      <article class="card peca" data-id="${c.id}">
        <div class="midia">${midiaHtml(c.midias) || `<div class="vazio peq" style="width:120px">sem mídia</div>`}</div>
        <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
          <div class="linha entre"><h3>${esc(c.pauta)}</h3><span class="pill ${cls}">${rot}</span></div>
          <div class="linha muted peq"><span class="mono">${esc(c.formato)}</span><span>· ${quando(c.agendado_para)}</span><span>· ${c.origem === "ricardo" ? "feita com você" : "feita pelo agente"}</span></div>
          ${c.motivo ? `<div class="peq warn">${esc(c.motivo)}</div>` : ""}
          ${c.legenda ? `<div class="legenda" data-leg>${esc(c.legenda)}</div><button class="btn peq" type="button" data-abrir style="align-self:flex-start;padding:4px 10px">Ver legenda inteira</button>` : ""}
          ${urlSegura(c.permalink) ? `<a href="${hrefSeguro(c.permalink)}" target="_blank" rel="noopener">Ver no Instagram</a>` : ""}
          ${editavel ? `
          <div class="linha"><label class="campo" style="flex:1 1 220px">Data e hora (Brasília)<input type="datetime-local" data-quando value="${paraInput(c.agendado_para)}" ${podeEditar() ? "" : "disabled"}></label></div>
          <div class="acoes">
            ${c.status !== "pronto" ? `<button class="btn sim" data-dec="aprovado" ${podeMudar() ? "" : "disabled"}>Aprovar</button>` : `<button class="btn" data-reag ${podeEditar() ? "" : "disabled"}>Salvar nova data</button>`}
            ${c.midias?.length ? `<button class="btn onca" data-postar ${podeMudar() ? "" : "disabled"}>Postar agora</button>` : ""}
            <button class="btn" data-dec="ajustar" ${podeEditar() ? "" : "disabled"}>Pedir ajuste</button>
            <button class="btn nao" data-dec="recusado" ${podeMudar() ? "" : "disabled"}>Recusar</button>
          </div>` : ""}
        </div>
      </article>`;
  }
  el.innerHTML = html;
  $$("[data-abrir]", el).forEach(b => b.onclick = () => { const l = b.previousElementSibling; l.classList.toggle("aberta"); b.textContent = l.classList.contains("aberta") ? "Fechar legenda" : "Ver legenda inteira"; });
  $$("article[data-id]", el).forEach(art => {
    const id = art.dataset.id, q = $("[data-quando]", art);
    $$("[data-dec]", art).forEach(b => b.onclick = async () => {
      const dec = b.dataset.dec; let obs = null;
      if (dec === "ajustar") { obs = prompt("O que precisa mudar?"); if (obs === null) return; }
      if (dec === "recusado") { if (!confirm("Recusar e tirar esta peça da fila?")) return; obs = prompt("Motivo (opcional):") || ""; }
      b.disabled = true;
      try { await rpc("nexo_decidir_conteudo", { p_conteudo: id, p_decisao: dec, p_obs: obs, p_quando: deInput(q?.value) }); aviso(dec === "aprovado" ? "Aprovada." : "Registrado."); await carregar(); }
      catch (e) { b.disabled = false; aviso(msgErro(e), true); }
    });
    const pa = $("[data-postar]", art);
    if (pa) pa.onclick = async () => {
      const c = st.conteudos.find(x => x.id === id) || {};
      const ctl = st.resumo.controle || {};
      const extra = !ctl.publicar ? "\n\nAtenção: Publicar está DESLIGADO no Início. A peça fica aprovada para agora, mas só sai quando você ligar."
                  : ctl.pausado ? "\n\nAtenção: o agente está PAUSADO. A peça só sai quando ele voltar." : "";
      if (!confirm(`Postar agora "${c.pauta || "esta peça"}"?\n\n${c.status === "pronto" ? "" : "Isso também APROVA a peça. "}Ela vai ao ar na próxima rodada do agente (em até 1 hora), depois de passar de novo no checador de fatos. Depois de publicada, só dá para apagar no Instagram.${extra}`)) return;
      pa.disabled = true;
      try {
        const r = await rpc("nexo_postar_agora", { p_conteudo: id });
        aviso(!r.publicar ? "Aprovada para agora. Ligue Publicar no Início para ela sair." :
              r.pausado ? "Aprovada para agora. O agente está pausado." :
              r.modo !== "automatico" ? "Aprovada para agora. O agente está em modo ensaio: ele só registra, não publica." :
              "Combinado: sai na próxima rodada do agente (em até 1 hora).");
        await carregar();
      } catch (e) { pa.disabled = false; aviso(msgErro(e), true); }
    };
    const rg = $("[data-reag]", art);
    if (rg) rg.onclick = async () => {
      rg.disabled = true;
      try { await rpc("nexo_reagendar", { p_conteudo: id, p_quando: deInput(q.value) }); aviso("Data salva."); await carregar(); }
      catch (e) { rg.disabled = false; aviso(msgErro(e), true); }
    };
  });
}

const NOME_CON = { faq: "FAQ (respostas automáticas)", fatos: "Fatos aprovados", voz: "Voz da marca" };
let conhec = null, faqEdit = null;
function situacaoCon(x) {
  const a = x?.ativa;
  if (!a) return `<span class="pill info">em uso: arquivo</span> <span class="muted peq">${x?.base ? "atualizado " + quando(x.base.atualizado_em) : "o agente ainda não mandou a base"}</span>`;

               a.aceito === false ? `<span class="pill bad">recusada: a Onça segue com o arquivo</span>` :
               `<span class="pill warn">esperando a conferência (próxima rodada)</span>`;
  return `<span class="pill onca">em uso: versão ${a.versao} do painel</span> ${conf}
    <div class="muted peq">salva ${quando(a.criado_em)} por ${esc((a.criado_por || "").replace("painel: ", ""))}</div>
    ${a.motivo ? `<div class="bad peq">Motivo: ${esc(a.motivo)}</div>` : ""}`;
}
function historicoCon(tipo, x) {
  const h = x?.historico || [];
  if (!h.length) return "";
  return `<details class="peq"><summary>Versões anteriores (${h.length})</summary><div class="tempo">${h.map(v => `
    <div class="it"><span class="mono muted">v${v.versao} · ${quando(v.criado_em)}</span><span>${v.ativa ? `<span class="pill onca">ativa</span>` : ""}
      ${v.aceito === true ? `<span class="pill ok">aceita</span>` : v.aceito === false ? `<span class="pill bad">recusada</span>` : ""}
      ${!v.ativa && podeMudar() ? `<button class="btn peq" data-reativar="${tipo}:${v.versao}" style="padding:2px 8px">Reativar</button>` : ""}</span></div>`).join("")}</div></details>`;
}
function fonteCon(x) { return x?.ativa?.conteudo || x?.base?.conteudo || null; }

  $$("[data-salvar]", el).forEach(b => b.onclick = async () => {

    catch (e) { aviso(msgErro(e), true); }
  });

function pintarFaq() {
  const dis = podeMudar() ? "" : "disabled";

    <div class="card" data-item="${i}" style="padding:10px">

function lerFaq() {
  $$("#faqItens [data-item]").forEach(c => {
    const it = faqEdit.itens[Number(c.dataset.item)];
    it.id = $("[data-id]", c).value.trim() || it.id;
    it.gatilhos = $("[data-gat]", c).value.split("\n").map(x => x.trim()).filter(Boolean);
    it.resposta = $("[data-resp]", c).value.trim();
  });
}

    const it = await rpc("nexo_atividades", { p_agente: st.agente });
    el.innerHTML = `<div class="card"><h2>Atividade</h2><p class="muted peq" style="margin:0">O que o agente fez e o que mudou no painel, mais recente primeiro.</p><div class="tempo">
      ${(it || []).map(x => `<div class="it"><span class="mono muted">${quando(x.em)}</span><span><span class="pill ${x.origem === "painel" ? "onca" : x.nivel === "erro" ? "bad" : x.nivel === "aviso" ? "warn" : "info"}">${esc(x.origem === "painel" ? "painel" : x.quem)}</span> <b>${esc(x.acao.replace(/_/g, " "))}</b> <span class="muted">${esc((x.texto || "").slice(0, 220))}</span></span></div>`).join("") || `<div class="vazio">Nada ainda.</div>`}
    </div></div>`;
  } catch (e) { el.innerHTML = `<div class="vazio">${esc(msgErro(e))}</div>`; }
}

// ---------------------------------------------------------------- AJUDA
function ajuda(el) {
  el.innerHTML = `
    <div class="card"><h2>Como usar</h2>
      <ol class="peq" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
        <li><b>Aprovar:</b> veja a peça, ajuste a data se quiser e toque em Aprovar. Ela só vai ao ar se <b>Publicar</b> estiver ligado no Início.</li>
        <li><b>Pausar tudo</b> no Início para o agente na próxima rodada (até 1 hora).</li>
        <li><b>Leads:</b> copie a mensagem pronta, mande pelo seu Instagram ou WhatsApp e mude o status para "Abordado".</li>
        <li><b>Agente</b> e <b>Funções:</b> nome, identidade, instruções, nível de autonomia e o que o agente pode fazer.</li>
        <li><b>Atividade:</b> tudo o que o agente fez e quem mudou o quê no painel.</li>
      </ol>
    </div>
    <div class="card"><h3>Em breve</h3><p class="muted peq" style="margin:0">Central de Ajuda com manual e vídeos curtos (Etapa 7) e conexão guiada do Instagram (Etapa 4).</p></div>
    <div class="muted mono">Logado como ${esc(st.ctx?.email)} · ${esc(PAPEL[st.resumo?.papel] || "")}</div>`;
}

// ---------------------------------------------------------------- início
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") mostrarLogin(); });
iniciar();
</script>
