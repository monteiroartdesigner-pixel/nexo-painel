<style>
/* ============================================================ design system: tokens */
:root{
  --bg:#07090E; --surface:#0C111D; --surface-2:#111A2C; --surface-3:#16213A;
  --border:#1C2741; --border-strong:#2A3A5E;
  --navy:#1B3A8A; --primary:#3B82F6; --primary-strong:#2563EB; --primary-soft:color-mix(in srgb,#3B82F6 14%,transparent);
  --text:#E7ECF6; --text-2:#B4C0D6; --muted:#7E8BA6;
  --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444; --info:#38BDF8;
  --ok-soft:color-mix(in srgb,#22C55E 14%,transparent); --warn-soft:color-mix(in srgb,#F59E0B 14%,transparent);
  --bad-soft:color-mix(in srgb,#EF4444 14%,transparent); --info-soft:color-mix(in srgb,#38BDF8 14%,transparent);
  --r-sm:8px; --r:12px; --r-lg:16px;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ft:"Syne","Inter",sans-serif;
  --t:160ms cubic-bezier(.2,.8,.2,1);
  --side:232px;
  color-scheme:dark;
  /* nomes usados pela janela de logo e cores (comum às duas áreas) */
  --panel:var(--surface); --borda:var(--border-strong); --fina:var(--border); --fg:var(--text); --cyan:var(--primary); --onca:#f2b632;
}
/* cor de destaque escolhida na janela de logo e cores (vale também aqui) */
:root[style*="--onca"]{--primary:var(--onca);--primary-strong:color-mix(in srgb,var(--onca) 82%,#000);--primary-soft:color-mix(in srgb,var(--onca) 16%,transparent)}
/* modo Claro · Café: creme, azul-marinho e contorno de adesivo, como as artes NEXO Marketing */
:root[data-tema="cafe"]{
  --bg:#F6EFE2; --surface:#FFFCF5; --surface-2:#FFF7EA; --surface-3:#F1E5CF;
  --border:rgba(22,34,77,.16); --border-strong:rgba(22,34,77,.42); --text:#16224D; --text-2:#34406B; --muted:#5C6684;
  --sh:4px 4px 0 #16224D; color-scheme:light; --destaque-fundo:#fff; --destaque-borda:#16224D;
}
[data-tema="cafe"] .card,[data-tema="cafe"] .col{border:2px solid #16224D;box-shadow:4px 4px 0 #16224D}
[data-tema="cafe"] .btn{border:2px solid #16224D;background:#fff;color:#16224D;box-shadow:2px 2px 0 #16224D}
[data-tema="cafe"] .btn.pri{background:var(--primary);color:#fff}
[data-tema="cafe"] .btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
[data-tema="cafe"] .nav a[aria-current="page"]{background:var(--primary);color:#fff;box-shadow:2px 2px 0 #16224D}
[data-tema="cafe"] .side,[data-tema="cafe"] .topm,[data-tema="cafe"] .bottom{background:#FFF6E6}
[data-tema="cafe"] .kc{background:#fff;border:2px solid rgba(22,34,77,.3)}
[data-tema="cafe"] .plat-marca b{color:#16224D} [data-tema="cafe"] .plat-marca span{color:#5C6684;opacity:1}
[data-tema="cafe"] .areas{background:#F1E5CF;border:2px solid #16224D}
[data-tema="cafe"] .areas a{color:#5C6684} [data-tema="cafe"] .areas a[aria-current="page"]{color:#16224D;background:#fff;box-shadow:inset 0 0 0 2px #16224D}
[data-tema="cafe"] .toast{background:#fff;color:#16224D;border:2px solid #16224D}
[data-tema="cafe"] .overlay{background:rgba(22,34,77,.35)}
[data-tema="cafe"] .input,[data-tema="cafe"] .select,[data-tema="cafe"] .textarea{background:#fff}
/* classes usadas pela janela de logo e cores */
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .entre{justify-content:space-between}
.btn.prim{background:var(--primary);border-color:transparent;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3,.kpi-n,.num{font-family:var(--ft);font-feature-settings:"lnum" 1,"tnum" 1;letter-spacing:-.01em}
h1{font-size:24px;margin:0;font-weight:800}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:14.5px;margin:0;font-weight:700;font-family:var(--f)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}
.muted{color:var(--muted)} .t2{color:var(--text-2)} .peq{font-size:12.5px} .tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================ componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--surface-2);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;
  transition:background var(--t),border-color var(--t),transform var(--t)}
.btn:hover{background:var(--surface-3);border-color:#3a4d78;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--primary);border-color:transparent;color:#fff}
.btn.emergencia{background:var(--bad);border-color:transparent;color:#fff}   /* Busca de emergência do master (18/11/2026) */
.btn.pri:hover{background:var(--primary-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0}
.btn svg,.ic{width:16px;height:16px;flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.pri{background:var(--primary-soft);color:#8DB5FF}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field small{color:var(--muted);font-size:12px}
.input,.select,.textarea{width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:9px 11px;
  transition:border-color var(--t),box-shadow var(--t);min-height:38px}
.textarea{min-height:84px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus,.btn:focus-visible,.chip:focus-visible{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);
  background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);transition:all var(--t)}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:#BBD3FF}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 18px;color:var(--text-2)}
.empty .ill{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:#8DB5FF}
.empty ol{text-align:left;margin:4px 0 0;padding-left:20px;color:var(--text-2)}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;background:var(--surface-3);
  border:1px solid var(--border-strong);border-left:4px solid var(--ok);padding:11px 16px;border-radius:10px;box-shadow:var(--sh);
  transition:all var(--t);max-width:min(560px,calc(100vw - 32px));font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)} .toast.erro{border-left-color:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--text-2);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert svg{color:var(--info);margin-top:2px} .alert.warn svg{color:var(--warn)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;background:var(--surface-2);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
td{padding:11px 12px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer;transition:background var(--t)} tbody tr:hover{background:var(--surface-2)}
.score{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:6px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.score.a{background:var(--ok-soft);color:var(--ok)} .score.m{background:var(--warn-soft);color:var(--warn)} .score.b{background:var(--surface-3);color:var(--muted)}

/* modal e gaveta */
.overlay{position:fixed;inset:0;background:rgba(3,5,10,.62);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity var(--t)}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:61;
  transform:translateX(100%);transition:transform 220ms cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.drawer-b{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;z-index:70;width:min(520px,calc(100vw - 24px));
  max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--sh);transition:all var(--t)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-h{padding:18px 20px 0} .modal-b{padding:16px 20px;display:flex;flex-direction:column;gap:14px} .modal-f{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px}

/* ============================================================ layout */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:start;gap:28px;padding:24px max(16px,3vw) 40px;max-width:1440px;margin:0 auto;box-sizing:border-box}.login .exp{width:100%}.login>.card{width:100%!important;position:sticky;top:20px}@media (max-width:900px){.login{grid-template-columns:1fr;gap:22px}.login>.card{order:-1;max-width:420px;justify-self:center;position:static}}
.login .card{width:min(400px,100%);padding:28px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#1B3A8A,#0B1736);border:1px solid #2B4FA8;display:grid;place-items:center;flex:0 0 auto}
.brand-mark svg{width:20px;height:20px}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-txt b{font-family:var(--ft);font-size:15px;letter-spacing:.14em;font-weight:700}
.brand-txt span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--border);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:var(--r-sm);color:var(--text-2);font-weight:500;transition:all var(--t)}
.nav a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav a[aria-current="page"]{background:var(--primary-soft);color:#BBD3FF}
.nav a .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.main{min-width:0;padding:22px 28px 60px;display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.g-2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi-n{font-size:26px;font-weight:700;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--primary));border-radius:99px;transition:width 400ms ease}
.funil{display:flex;flex-direction:column;gap:10px}
.funil .f{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--border);cursor:pointer;border-radius:8px;transition:background var(--t)}
.li:first-child{border-top:0} .li:hover{background:var(--surface-2)}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto;background:var(--surface-3);color:#BBD3FF;font-family:var(--ft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .input,.toolbar .select{height:36px;min-height:36px;padding:6px 10px;width:auto}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:10px;top:10px;color:var(--muted)}
.search .input{padding-left:32px;width:100%}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 240px);min-height:160px}
.col-h{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);font-weight:600}
.col-h .n{margin-left:auto;color:var(--muted);font-size:12.5px}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1}
.col.over{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--surface))}
.kc{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:11px 12px;cursor:grab;display:flex;flex-direction:column;gap:7px;transition:border-color var(--t),transform var(--t)}
.kc:hover{border-color:var(--border-strong)} .kc.drag{opacity:.45}
.kc .nm{font-weight:600;line-height:1.3}
.kc .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.kc .kc-st{width:auto;height:28px;min-height:28px;padding:2px 8px;font-size:12px;cursor:pointer}

/* ficha */
.next{border:1px solid color-mix(in srgb,var(--primary) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--navy) 35%,transparent),transparent);border-radius:var(--r);padding:14px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--border);margin-left:6px}
.tl{position:relative;padding:0 0 14px 16px}
.tl::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface-3);border:2px solid var(--primary)}
.msg{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;white-space:pre-wrap;color:var(--text-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}

function kanban(el, l) {

async function mudarStatus(id, status, silencioso) {
  const e = S.empresas.find(x => x.id === id);
  if (!e || e.status === status || (status === "perdido" && e.status === "nao_contatar")) return;
  const antes = e.status; e.status = status; if (rotaAtual() === "crm") corpoCrm();
  try { await rpc("nexo_prospect_mudar_empresa", { p_empresa: id, p_status: status, p_nota: null }); if (!silencioso) toast(`${e.nome}: ${ST[status][0]}.`); }
  catch (err) { e.status = antes; if (rotaAtual() === "crm") corpoCrm(); toast(msgErro(err), true); }
}

// Próxima rodada do robô (seg. a sáb., 06:10 manhã, 12:10 tarde, 18:10 noite) e quais campanhas entram nela.
function proximaRodadaProspect() {
  const agora = new Date(), sp = new Date(agora.toLocaleString("en-US", { timeZone: FUSO })), dif = agora - sp;
  for (let d = 0; d < 8; d++) for (const [h, m, t] of [[6, 10, "manha"], [12, 10, "tarde"], [18, 10, "noite"]]) {
    const n = new Date(sp); n.setDate(n.getDate() + d); n.setHours(h, m, 0, 0);
    const dia = ((n.getDay() + 6) % 7) + 1;   // 1 = segunda … 7 = domingo
    if (n > sp && dia <= 6) return { quando: new Date(+n + dif), turno: t, dia };
  }
  return null;
}
// Rodadas das 06:10, 12:10 e 18:10: mostra se a entrega chegou e quando (pedido do Ricardo, 18/11/2026).

function quadroRodadas() {
  const r = S.rodadas; if (!r) return "";
  const hora = d => new Date(d).toLocaleString("pt-BR", { timeZone: FUSO, hour: "2-digit", minute: "2-digit" });
  const dia = d => { const x = new Date(d).toLocaleDateString("pt-BR", { timeZone: FUSO }), hoje = new Date().toLocaleDateString("pt-BR", { timeZone: FUSO });
    return x === hoje ? "hoje" : new Date(d).toLocaleDateString("pt-BR", { timeZone: FUSO, weekday: "short", day: "2-digit" }); };
  const linha = x => {
    const [rot, cls] = { gravada: ["Chegou", "ok"], aguardando: ["Pesquisando", "info"], atrasada: ["Não chegou", "bad"] }[x.estado] || [x.estado, ""];
    const det = x.estado === "gravada"
      ? `Gravada às ${hora(x.gravado_em)} · ${pl(x.empresas_novas, "empresa nova", "empresas novas")} para você${r.master && x.leads_novos != null ? ` · ${pl(x.leads_novos, "lead", "leads")} do Várzea` : ""}`
      : x.estado === "aguardando" ? "A equipe está pesquisando. A entrega chega em até 40 minutos."
      : `Passou do horário e a entrega não foi gravada.${r.master ? " Use os botões abaixo." : " A NEXO já foi avisada."}`;
    return `<div class="rd-l ${cls}"><b class="tnum">${hora(x.horario)}</b><span class="muted peq">${dia(x.horario)}</span>
      <span class="badge ${cls}"><span class="dot"></span>${rot}</span><span class="peq t2" style="flex:1 1 220px;min-width:0">${det}</span></div>`;
  };
  const atrasada = (r.rodadas || []).some(x => x.estado === "atrasada");
  return `<section class="card stack"><div class="card-h" style="margin:0"><h2>Rodadas da equipe</h2><span class="muted peq">06:10 · 12:10 · 18:10</span></div>
    <div class="rd-lista">${(r.rodadas || []).map(linha).join("") || `<div class="muted peq">Nenhuma rodada ainda.</div>`}</div>
    ${r.master ? `<div class="rd-master${atrasada ? " alerta" : ""}"><div class="peq"><b>Master:</b> se uma rodada não chegou, grave o que a equipe já entregou. Se não houve entrega, peça uma rodada extra.</div>

        <button class="btn sm" data-rodada="buscar" title="Faz uma rodada de busca fora dos 3 horários">${ic("bolt")}Rodar a busca agora</button></div>
      ${(r.pedidos || []).length ? `<div class="peq muted">Pedidos recentes: ${r.pedidos.map(p => `${p.acao === "rodada_gravar_pedida" ? "gravar" : "buscar"} às ${hora(p.em)}`).join(" · ")}</div>` : ""}</div>` : ""}
  </section>`;
}

      headers: { Authorization: "Bearer " + sessao.access_token, apikey: SUPABASE_KEY, "Content-Type": "application/json" },
